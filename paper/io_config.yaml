# SigmaFlux training configuration — Issatchenkia orientalis
name: I_orientalis
model_file: models/I_orientalis/imIsor_annotated.json
seed: 42
device: auto  # auto | cpu | cuda

# ── Flux sampling (sample_flux.py) ──────────────────────────────────────────
sampling:
  n_samples: 50000
  thinning: 100
  processes: 4
  method: optgp       # optgp | achr

  growth:
    lb: 0.1
    ub: 0.5

  # Only reactions listed here are open; all other EX_ reactions are closed (0, 0).
  # Convention (after standardization): met_e →  i.e. positive flux = secretion,
  # negative flux = uptake.
  media:
    # Carbon source — mandatory uptake
    EX_glc__D_e: {lb: -20.0, ub: -1.0}
    # Electron acceptor — mandatory uptake
    EX_o2_e:     {lb: -100.0, ub: 0.0}
    # Carbon secretion products
    EX_co2_e:    {lb: 0.0,  ub: 100.0}
    EX_etoh_e:   {lb: 0.0,  ub: 100.0}
    EX_ac_e:     {lb: 0.0,  ub: 100.0}
    EX_glyc_e:   {lb: 0.0,  ub: 100.0}
    EX_succ_e:   {lb: 0.0,  ub: 100.0}
    # Essential macronutrients — unrestricted uptake
    EX_nh4_e:    {lb: -100.0, ub: 0.0}
    EX_pi_e:     {lb: -1000.0, ub: 0.0}
    EX_so4_e:    {lb: -1000.0, ub: 0.0}
    # Water and proton — freely exchangeable
    EX_h2o_e:    {lb: -100.0, ub: 100.0}
    EX_h_e:      {lb: -100.0, ub: 100.0}
    # Trace minerals — unrestricted uptake
    EX_ca2_e:    {lb: -100.0, ub: 0.0}
    EX_cu2_e:    {lb: -100.0, ub: 0.0}
    EX_fe2_e:    {lb: -100.0, ub: 0.0}
    EX_k_e:      {lb: -100.0, ub: 0.0}
    EX_mg2_e:    {lb: -100.0, ub: 0.0}
    EX_mn2_e:    {lb: -100.0, ub: 0.0}
    EX_zn2_e:    {lb: -100.0, ub: 0.0}

  fva:
    enabled: false
    fraction: 0.1

# ── Isotope labeling simulation (generate_training_data.py) ─────────────────
labeling:
  batch_size: 500
  # Each entry is one tracer experiment. The tracer_id must correspond to a
  # metabolite that is open in the media (i.e. has a non-zero EX_ reaction).
  # Multiple entries with the same tracer_id but different labeling patterns
  # represent mixed-label experiments (e.g. 50% U-13C + 50% 1,2-13C glucose).
  tracers:
    - tracer_id: glc__D_e
      labeling: [1, 1, 1, 1, 1, 1]
      enrichment: 0.5
    - tracer_id: glc__D_e
      labeling: [1, 1, 0, 0, 0, 0]
      enrichment: 0.5

# ── Transformer training (train_ai_model.py) ─────────────────────────────────
training:
  output_model: imisor_transformer.pt
  epochs: 50
  batch_size: 32
  learning_rate: 0.001
  warmup_epochs: 5
  gradient_clip: 1.0
  scheduler: true
  loss: variance      # variance | mse
  val_fraction: 0.2
  max_samples: 15000

  # Architecture (FluxDecoder cross-attention decoder)
  combined_dim: 128       # d_model
  num_attn_heads: 4       # n_head
  num_transformer_layers: 4
  dropout: 0.3

  # Radial embedding dimensions (number of harmonics H per vocabulary).
  # Resulting embedding vector length = 2*H.
  # Set to null to auto-compute H = ceil(log2(N)) from vocab size.
  h_compound: 16   # compounds  — full metabolic model vocab (~400 metabolites → 32-dim)
  h_label: 5       # isotopomer labels (M+0, M+1, …  → 10-dim)
  h_tracer: 1      # tracer identities (1–2 tracers   →  2-dim)

  # Missing-data augmentation: randomly mask entire tracer experiments during training.
  mask_prob: 0.2
  min_experiments: 1 #TODO does this still make sense with the token embeddings?
  # Measured fluxes are passed directly to the transformer alongside labeling data.
  # List the exchange reaction IDs whose fluxes will be measured experimentally.
  measured_fluxes:
    - EX_glc__D_e
    - EX_etoh_e
    - EX_ac_e
    - EX_glyc_e
    - EX_succ_e
    - BIOMASS

  # Denoising autoencoder: proportional Gaussian noise added to measured fluxes
  # during training only (0 = off). Forces model to cross-reference MID data
  # with noisy v_known, learning to denoise at inference time.
  flux_noise_std: 0.10
  # L2 regularization on y_norm predictions (null-space mode only). Pulls
  # unobservable y-components toward 0 (prior mean in normalized y-space),
  # preventing overfitting in directions with no MID signal (e.g. sulfur pathway).
  y_l2_reg: 0.05