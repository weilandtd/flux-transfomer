# SigmaFlux training configuration — Issatchenkia orientalis
name: I_orientalis
model_file: models/I_orientalis/imIsor_annotated_hierarchical.json
seed: 42
device: auto  # auto | cpu | cuda

# ── Flux sampling (sample_flux.py) ──────────────────────────────────────────
sampling:
  n_samples: 200
  thinning: 100
  processes: 8
  method: optgp       # optgp | achr
  fva: true # Constraint the model by FVA
  ko: false # Sample each nonessential single-gene KO as well  n_samples x (1 + num_nonessential_KOs) 

  growth:
    lb: 0.01
    ub: 0.5

  # Only reactions listed here are open; all other EX_ reactions are closed (0, 0).
  # Convention (after standardization): met_e →  i.e. positive flux = secretion,
  # negative flux = uptake.
  media:
    # Carbon source — mandatory uptake
    EX_glc__D_e: {lb: -12.0, ub: -1.0}
    # Electron acceptor — mandatory uptake
    EX_o2_e:     {lb: -100.0, ub: 0.0}
    # Carbon secretion products
    EX_co2_e:    {lb: 0.0,  ub: 100.0}
    EX_etoh_e:   {lb: 0.0,  ub: 100.0}
    EX_ac_e:     {lb: 0.0,  ub: 100.0}
    EX_glyc_e:   {lb: 0.0,  ub: 100.0}
    EX_succ_e:   {lb: 0.0,  ub: 100.0}
    # Essential macronutrients — unrestricted uptake
    EX_nh4_e:    {lb: -100.0, ub: 0.0}
    EX_pi_e:     {lb: -100.0, ub: 0.0}
    EX_so4_e:    {lb: -100.0, ub: 0.0}
    # Water and proton — freely exchangeable
    EX_h2o_e:    {lb: -100.0, ub: 100.0}
    EX_h_e:      {lb: -100.0, ub: 100.0}
    # Trace minerals — unrestricted uptake
    EX_ca2_e:    {lb: -100.0, ub: 0.0}
    EX_cu2_e:    {lb: -100.0, ub: 0.0}
    EX_fe2_e:    {lb: -100.0, ub: 0.0}
    EX_k_e:      {lb: -100.0, ub: 0.0}
    EX_mg2_e:    {lb: -100.0, ub: 0.0}
    EX_mn2_e:    {lb: -100.0, ub: 0.0}
    EX_zn2_e:    {lb: -100.0, ub: 0.0}


# ── Isotope labeling simulation (generate_training_data.py) ─────────────────
labeling:
  batch_size: 512
  # Each entry is one tracer experiment. The tracer_id must correspond to a
  # metabolite that is open in the media (i.e. has a non-zero EX_ reaction).
  # Multiple entries with the same tracer_id but different labeling patterns
  # represent mixed-label experiments (e.g. 50% U-13C + 50% 1,2-13C glucose).
  tracers:
    - tracer_id: glc__D_e
      labeling: [1, 1, 1, 1, 1, 1]
      enrichment: 0.5
      name : "U-13C glucose (50%)"
    - tracer_id: glc__D_e
      labeling: [1, 1, 0, 0, 0, 0]
      enrichment: 0.5
      name: "1,2-13C glucose (50%)"

# ── Transformer training (train_ai_model.py) ─────────────────────────────────
training:
  output_model: imisor_transformer.pt
  epochs: 150
  batch_size: 512
  learning_rate: 0.001
  warmup_epochs: 5
  gradient_clip: 1.0
  scheduler: true
  val_fraction: 0.2
  max_samples: null

  # Architecture (FluxDecoder cross-attention decoder)
  combined_dim: 128       # d_model
  num_attn_heads: 8       # n_head
  num_transformer_layers: 4
  dropout: 0.3

  # Radial embedding dimensions (number of harmonics H per vocabulary).
  # Resulting embedding vector length = 2*H.
  # Set to null to auto-compute H = ceil(log2(N)) from vocab size.
  h_compound: 16   # compounds  — full metabolic model vocab (~400 metabolites → 32-dim)
  h_label: 5       # isotopomer labels (M+0, M+1, …  → 10-dim)
  h_tracer: 1      # tracer identities (1–2 tracers   →  2-dim)
  h_reaction: 8    # reaction identities (n_rxns reactions → 16-dim)
  h_type: 2        # token-type embedding (0=labeling, 1=flux →  4-dim, frozen)

  # Missing-data augmentation: randomly mask individual metabolites (all isotopomers
  # together) during training. Simulates metabolites not detected in the MS run.
  met_mask_prob: 0.2
  flux_mask_prob: 0.2

  # Measured fluxes fed as soft inputs through the fusion layer.
  # Hierarchical model: PROTEIN_c etc. are stoichiometrically coupled to BIOMASS
  # via intermediate metabolites, so they're NOT independent null-space DOFs.
  measured_fluxes:
    - EX_glc__D_e
    - PROTEIN_c
    - RNA_c
    - DNA_c
    - LIPID_c
    - CARB_c
    - EX_etoh_e
    - EX_ac_e
    - EX_glyc_e
    - EX_succ_e


  flux_noise_std: 0.0
  labeling_noise_std: 0.01  # Gaussian noise std (0 = disabled)
  loss: variance               # variance | mse
  flux_loss_space: mixed       # basis | flux | mixed — train in null-space, reconstructed flux, or combination
  mixed_flux_weight: 0.35      # weight for flux-space loss when flux_loss_space=mixed (0.35 = 35% flux, 65% basis)
  variance_min_cutoff: 0.1     # min variance clamp for loss weighting (prevents division by zero and extreme weighting)
  measured_flux_loss_weight: 0.0  # auxiliary MSE penalty on predicted vs. known measured fluxes


