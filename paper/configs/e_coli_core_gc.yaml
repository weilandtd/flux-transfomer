# SigmaFlux training configuration — E. coli core, GC/MS fragments
#
# The E. coli core network with one fragment pool per GC/MS ion the core can carry
# (Ala232 = alanine C2-C3, ...), built by models/atomistic/build_gcms_fragment_model.py.
name: E_coli_core
model_file: models/atomistic/E_coli_core/e_coli_core_gcms_annotated.json
# Read by training's restrict_to_mapped feature filter and by sigmaflux-infer; its
# formula/n_backbone columns make the loader correct the raw MIDs for natural isotopes.
mapping_csv: models/atomistic/E_coli_core/E_coli_core_fragment_mapping.csv
seed: 42
device: auto  # auto | cpu | cuda

# GC-MS arm of the same Long & Antoniewicz (2019) study: 21 growth conditions x 1
# replicate, measured as fragments. The LC-MS arm is data/E_coli_LC_MS, via e_coli_core.yaml.
experiment:
  data_dir: data/E_coli_GC_MS
  gem_xlsx: models/atomistic/E_coli_core/example_GEM.xlsx
  mapping_csv: models/atomistic/E_coli_core/E_coli_core_fragment_mapping.csv
  reference_flux: E_coli_core_reference_flux.xlsx
  # Bootstrapped cross-tracer replicate combinations used to propagate measurement
  # uncertainty. The reported interval's width still follows the pooled replicate
  # dof, sum(R_t - 1), not this count.
  n_bootstrap: 200
  # Reactions each strain's deletion removes (strain_index.csv), for sigmaflux-infer
  # --fbapro. Only genes that are the sole route through a core reaction; isozymes
  # (pfkA/B, fbaB, tktA/B, talA/B, rpiB, sgcE, fbp), the non-enzymatic pgl bypass and
  # genes without a core reaction (glk, pgm) pin nothing.
  knockouts:
    B4:  [R1]    # pgi
    B9:  [R4]    # tpiA
    B10: [R8]    # zwf
    B12: [R9]    # gnd
    B13: [R10]   # rpe
    B20: [R15]   # edd
    B21: [R16]   # eda

# Nothing dropped: unlike the yeasts and the T cell, this model has a single lumped
# biomass with no macromolecule split, so BIOMASS itself is the growth measurement and
# has to stay in the network.
skip_constraints: []

# ── Flux sampling (sample_flux.py) ──────────────────────────────────────────
sampling:
  n_samples: 10000
  thinning: 100
  processes: 8
  method: optgp
  fva: true
  ko: false  # false | all | random | uncorrelated

  stratified_sampling:
    enabled: true
    n_subsamples: auto            # ceil(n_samples / n_bins / (1 + KO count)); int also accepted
    n_bins: 20
    reactions: null               # null → training.measured_fluxes

  # Absolute units, mmol/gDW/h, so growth is a real specific growth rate.
  growth:
    lb: 0.01
    ub: 0.8

  # Convention (after standardization): positive flux = secretion, negative = uptake.
  #
  # This network fuses glucose transport with hexokinase in `gluc_up`
  # (ATP + Gluc_e --> G6P), so EX_Gluc_e is the only clean handle on glucose entry
  # and `gluc_up` carries the first glycolytic step as well. `EX_Biomass` drains the
  # `Biomass` metabolite, which nothing else consumes.
  media:
    EX_Gluc_e:   {lb: -15.0,  ub: 0.0}
    EX_O2_e:     {lb: -30.0,  ub: 0.0}
    EX_NH3_e:    {lb: -20.0,  ub: 0.0}
    EX_SO4_e:    {lb: -20.0,  ub: 0.0}
    EX_Ac_e:     {lb: 0.0,    ub: 30.0}
    EX_CO2_e:    {lb: 0.0,    ub: 50.0}
    EX_Biomass:  {lb: 0.0,    ub: 5.0}

# ── Isotope labeling simulation (generate_training_data.py) ─────────────────
labeling:
  batch_size: 512
  tracers:
    - tracer_id: Gluc_e
      labeling: [1, 1, 0, 0, 0, 0]
      enrichment: 1.0
      name: "1,2-13C glucose"
    # Long & Antoniewicz ran [1,2-13C] and [1,6-13C]glucose in parallel; the workbooks'
    # second sheet was labelled U-13C until check_fragments_at_reference.py showed it
    # fits [1,6-13C] (median fragment RMSE 0.02 vs 0.60).
    - tracer_id: Gluc_e
      labeling: [1, 0, 0, 0, 0, 1]
      enrichment: 1.0
      name: "1,6-13C glucose"

# ── Feature selection (extract_informative_features.py) ─────────────────────
features:
  restrict_to_mapped: true          # only the fragments the GC/MS data reports
  exclude_extracellular: true
  token_selection_method: all       # all measurable tokens; no significance test

# ── Transformer training (train_ai_model.py) ─────────────────────────────────
training:
  output_model: ecoli_core_transformer.pt
  ensemble_size: 20
  epochs: 1000
  early_stopping_patience: 10
  batch_size: 256
  learning_rate: 0.001
  warmup_epochs: 5
  gradient_clip: 1.0
  scheduler: true
  val_fraction: 0.1
  max_samples: 10000

  combined_dim: 256
  num_attn_heads: 8
  num_transformer_layers: 4
  dropout: 0.2

  # 67 metabolites and 77 reactions plus the fragment pools — a much smaller vocabulary
  # than the yeasts.
  h_compound: 7
  h_label: 5
  h_tracer: 1
  h_reaction: 7
  h_type: 2

  flux_token_dropout: 0.2
  labeling_token_dropout: 0.2
  normalize_mids: false

  # What the published MFA constrains: glucose uptake (its basis) and acetate yield.
  # O2 and CO2 are deliberately absent — off-gas rates are hard to measure and were
  # not reported here, so treating them as known inputs would be wishful.
  measured_fluxes:
    - EX_Gluc_e
    - EX_Ac_e
    - BIOMASS

  flux_noise_std: 0.05
  labeling_noise_std: 0.01
  loss: variance
  null_space_type: targeted_ica
  flux_loss_space: basis
  variance_min_cutoff: 0.1
